<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модуль 6.6.1</title>
</head>
<body>
    <script>
        const obj = {
            some: 'some',
            dom: 'text',
            arr: [1, 2, 3, 4, 5],
            tom: 'there'
        };

        const arrValues = [];

        for (let key in obj) {
            const value = obj[key];
            
            if (Array.isArray(value)) {
                for (let i = 0; i < value.length; i++) {
                    arrValues.push(value[i]);
                }
            } else {
                arrValues.push(value);
            }
        }

        console.log(arrValues);
    </script>
</body>
</html>
